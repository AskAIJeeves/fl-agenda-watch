name: Agenda watch
on:
  schedule:
    - cron: "7 8 * * *"     # 2:07 AM Central (GitHub schedules can run late or skip; two slots for safety)
    - cron: "37 9 * * *"    # 3:37 AM Central, both before the 5:43 AM Central digest
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: data-writer
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf
      - run: python scripts/fetch_agendas.py
      - run: python scripts/fetch_pdf_agendas.py
        continue-on-error: true
      - run: python scripts/build_candidates.py
      - run: python scripts/archive_items.py
      - name: Commit results
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Agenda data $(date -u +%F)"
          git pull --rebase -X theirs || true
          git push
      - name: Publish SQLite database as a release asset (not committed to git)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/build_sqlite.py
          gh release view db >/dev/null 2>&1 || gh release create db --title "Agenda database (rebuilt nightly)" --notes "SQLite build of data/archive. Download fl_agenda.sqlite and open with DB Browser for SQLite."
          gh release upload db data/fl_agenda.sqlite --clobber
