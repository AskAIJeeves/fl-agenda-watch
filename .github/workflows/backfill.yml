name: Backfill (one-time)
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours until data/backfill_state.json shows remaining 0, then disable
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: data-writer
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf
      - run: python scripts/backfill_legistar.py 1440
        continue-on-error: true
      - run: python scripts/backfill_pdf.py 1440
        continue-on-error: true
      - name: Commit results
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Backfill $(date -u +%F-%H%M)"
          git pull --rebase -X theirs || true
          git push
